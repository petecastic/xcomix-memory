name: Sync DKORN time-capsule locks
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync-dkorn-locks
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Discover $DKORN Jupiter Locks (read-only getProgramAccounts)
        run: node scripts/sync-dkorn-locks.mjs
      - name: Commit locks.json if it changed
        run: |
          if git diff --quiet -- vault-clock/locks.json; then echo "No change"; exit 0; fi
          git config user.name "petecastic"
          git config user.email "petecastic@users.noreply.github.com"
          git add vault-clock/locks.json
          git commit -m "vault-clock: sync DKORN time-capsule locks"
          git pull --rebase origin main
          git push origin main
