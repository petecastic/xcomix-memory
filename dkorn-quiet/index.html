<div class="wrap">
<h1>DON'T WAKE <span>BABY KILO</span></h1>
<p class="sub">3 AM hush game · Sub-Station 13 · STAGE: CIRCUIT-13</p>
<div class="modes"><button id="mEndless" class="on">Endless Night</button><button id="mDaily">Daily 3 AM Shift</button>
</div>
<div class="bhud">
<span>SCORE <b id="sc">0</b></span><span>STREAK <b id="st">0</b></span>
<span>KILO <b id="kilo">😴</b></span><span>SLEEP <b id="sleep">100</b>%</span>

</div>
<div class="stage" id="stage"><canvas id="cv" width="360" height="320"></canvas></div>
<div class="gestures">
<button class="shh" data-g="shh">🤫 Finger-Shh<br><small>Dkorn</small></button>
<button class="lasso" data-g="lasso">🌀 Cyan Lasso Mute<br><small>Voltia</small></button>
<button class="pretzel" data-g="pretzel">🥨 Warm Pretzel<br><small>Teether</small></button>
<button class="coffee" data-g="coffee">☕ Coffee Steam<br><small>Uncle Krampus</small></button>
</div>
<p class="quip" id="quip">Tap the matching Quiet gesture before the noise hits the crib.</p>
